<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#16a34a" opacity="0.1"/>
  <circle cx="1100" cy="530" r="150" fill="#16a34a" opacity="0.1"/>
  
  <!-- Main content container -->
  <rect x="100" y="150" width="1000" height="330" rx="20" fill="white" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
  
  <!-- Logo placeholder -->
  <rect x="150" y="200" width="80" height="80" rx="16" fill="#16a34a"/>
  <text x="190" y="255" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">W</text>
  
  <!-- Title -->
  <text x="260" y="250" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#16a34a">Webyalaya</text>
  
  <!-- Tagline -->
  <text x="150" y="330" font-family="Arial, sans-serif" font-size="28" fill="#374151">Peer to Peer Learning Platform</text>
  
  <!-- Description -->
  <text x="150" y="390" font-family="Arial, sans-serif" font-size="20" fill="#6b7280">Learn and teach with peers. Join study rooms,</text>
  <text x="150" y="420" font-family="Arial, sans-serif" font-size="20" fill="#6b7280">host sessions, and grow together.</text>
  
  <!-- URL -->
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="18" fill="#16a34a" text-anchor="middle">webyalaya.com</text>
</svg>

