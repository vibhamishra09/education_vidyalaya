global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'webyalaya-monitor'

scrape_configs:
  # Production Backend - be.test.webyalaya.com
  - job_name: 'nestjs-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['be.test.webyalaya.com:443']
        labels:
          service: 'webyalaya-backend'
          environment: 'production'
    scheme: https
    scrape_interval: 10s
    scrape_timeout: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
