global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'webyalaya-monitor'

scrape_configs:
  - job_name: 'nestjs-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3001']
        labels:
          service: 'webyalaya-backend'
          environment: 'development'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
