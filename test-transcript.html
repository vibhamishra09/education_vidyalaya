<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcript WebSocket Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; max-height: 400px; overflow-y: auto; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { padding: 10px 20px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        input { padding: 8px; margin: 5px; border: 1px solid #ccc; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>🎤 Transcript WebSocket Test</h1>
    
    <div>
        <label>Backend URL:</label>
        <input type="text" id="backendUrl" value="http://localhost:3001" style="width: 300px;">
    </div>
    
    <div>
        <label>Auth Token:</label>
        <input type="text" id="authToken" placeholder="Enter your Clerk JWT token" style="width: 400px;">
        <small>(Get this from browser dev tools in a logged-in session)</small>
    </div>
    
    <div>
        <label>Call ID:</label>
        <input type="text" id="callId" value="test-call-123" style="width: 200px;">
    </div>
    
    <div>
        <label>User ID:</label>
        <input type="text" id="userId" value="test-user-456" style="width: 200px;">
    </div>
    
    <div style="margin: 20px 0;">
        <button class="btn-primary" onclick="connectWebSocket()">🔌 Connect WebSocket</button>
        <button class="btn-success" onclick="startSpeechRecognition()" id="speechBtn">🎤 Start Speech Recognition</button>
        <button class="btn-danger" onclick="sendTestTranscript()">📝 Send Test Transcript</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>
    
    <div id="status">Status: Disconnected</div>
    
    <div class="log" id="log"></div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        let socket = null;
        let recognition = null;
        let isListening = false;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            logDiv.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function updateStatus(status) {
            document.getElementById('status').textContent = `Status: ${status}`;
        }

        function connectWebSocket() {
            const url = document.getElementById('backendUrl').value;
            const token = document.getElementById('authToken').value;
            
            if (!token) {
                log('❌ Please enter an auth token', 'error');
                return;
            }

            log(`🔌 Connecting to: ${url}`, 'info');
            
            socket = io(url, {
                auth: { token },
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionAttempts: 5,
                reconnectionDelay: 1000,
            });

            socket.on('connect', () => {
                log('✅ WebSocket connected successfully!', 'success');
                updateStatus('Connected');
            });

            socket.on('connect_error', (err) => {
                log(`🚨 Connection failed: ${err.message}`, 'error');
                updateStatus('Connection Failed');
            });

            socket.on('disconnect', (reason) => {
                log(`🔌 Disconnected: ${reason}`, 'info');
                updateStatus('Disconnected');
            });

            socket.on('transcript-received', (data) => {
                log(`📝 Server acknowledged: "${data.text}"`, 'success');
            });

            socket.on('transcript-error', (error) => {
                log(`❌ Server error: ${error.message || error}`, 'error');
            });
        }

        function startSpeechRecognition() {
            if (!socket || !socket.connected) {
                log('❌ WebSocket not connected', 'error');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                log('❌ Speech recognition not supported in this browser', 'error');
                return;
            }

            if (isListening) {
                // Stop recognition
                if (recognition) {
                    recognition.stop();
                }
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('speechBtn').textContent = '🛑 Stop Recognition';
                log('🎤 Speech recognition started', 'success');
            };

            recognition.onresult = (event) => {
                const results = event.results;
                const lastResult = results[event.resultIndex];
                
                if (lastResult) {
                    const transcript = lastResult[0].transcript;
                    const isFinal = lastResult.isFinal;
                    const callId = document.getElementById('callId').value;
                    const userId = document.getElementById('userId').value;

                    if (transcript && transcript.trim().length > 0) {
                        const payload = {
                            user: userId,
                            text: transcript,
                            timestamp: Date.now(),
                            callId: callId,
                        };

                        socket.emit('transcript-chunk', payload);
                        log(`🎤 Sent ${isFinal ? 'final' : 'interim'}: "${transcript.substring(0, 50)}${transcript.length > 50 ? '...' : ''}"`, 'info');
                    }
                }
            };

            recognition.onerror = (event) => {
                log(`🚨 Speech recognition error: ${event.error}`, 'error');
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('speechBtn').textContent = '🎤 Start Speech Recognition';
                log('🛑 Speech recognition stopped', 'info');
            };

            recognition.start();
        }

        function sendTestTranscript() {
            if (!socket || !socket.connected) {
                log('❌ WebSocket not connected', 'error');
                return;
            }

            const callId = document.getElementById('callId').value;
            const userId = document.getElementById('userId').value;
            const testText = "This is a test transcript message to verify WebSocket functionality.";

            const payload = {
                user: userId,
                text: testText,
                timestamp: Date.now(),
                callId: callId,
            };

            socket.emit('transcript-chunk', payload);
            log(`📝 Sent test transcript: "${testText}"`, 'info');
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
    </script>
</body>
</html>
