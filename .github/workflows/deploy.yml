name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'my-app/**'
      - '.github/workflows/deploy.yml'

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: webyalaya-backend-app
  ECS_CLUSTER: webyalaya-backend-cluster
  ECS_SERVICE: webyalaya-backend-task-service
  MIGRATION_TASK_DEF: webyalaya-backend-migrate-task
  MIGRATION_SG_NAME: ecs-webyalaya-tasks-sg
  SUBNET_TAG_KEY: Name
  SUBNET_TAG_VALUE: webyalaya-subnet

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'my-app/**'
      - name: Debug changes
        run: |
          echo "Backend changes detected: ${{ steps.filter.outputs.backend }}"
          echo "Frontend changes detected: ${{ steps.filter.outputs.frontend }}"

  deploy-backend:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://dummy:dummy@dummy:5432/dummy"
        run: pnpm exec prisma generate

      - name: Build application
        working-directory: ./backend
        run: pnpm build

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./backend
        run: |
          # Build Docker image (no tag = implicitly uses :latest)
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY .

          # Also tag with SHA for traceability
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          # Push both: untagged (latest) and SHA-tagged
          docker push $ECR_REGISTRY/$ECR_REPOSITORY
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY" >> $GITHUB_OUTPUT

      - name: Run Prisma Migrations in ECS
        run: |
          # --- Configuration (ADJUST THESE VALUES) ---
          TASK_DEF="${{ env.MIGRATION_TASK_DEF }}"
          CLUSTER="${{ env.ECS_CLUSTER }}"
          LAUNCH_TYPE="FARGATE"

          SECURITY_GROUPS=$(aws ec2 describe-security-groups \
            --filters Name=group-name,Values="${{ env.MIGRATION_SG_NAME }}" \
            --query 'SecurityGroups[0].GroupId' --output text)

          SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=tag:${{ env.SUBNET_TAG_KEY }},Values=${{ env.SUBNET_TAG_VALUE }}" \
            --query 'Subnets[*].SubnetId' --output text | tr '\t' ',')
            
          if [ -z "$SECURITY_GROUPS" ] || [ -z "$SUBNETS" ]; then
              echo "Failed to look up necessary network IDs. SG: $SECURITY_GROUPS, Subnets: $SUBNETS"
              exit 1
          fi

          echo "Found Security Group ID: $SECURITY_GROUPS"
          echo "Found Subnet IDs: $SUBNETS"
          
          echo "Starting migration task for Task Definition: $TASK_DEF"

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --launch-type "$LAUNCH_TYPE" \
            --task-definition "$TASK_DEF" \
            --count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" == "None" ]; then
              echo "Failed to start migration task. Exiting."
              exit 1
          fi
          
          echo "Started migration task ARN: $TASK_ARN"

          # Wait for Task Completion
          # This command will block until the migration task finishes.
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          # Check for Success
          # Retrieve the exit code of the migration container.
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task failed with exit code $EXIT_CODE"
            # Crucial: Fail the workflow to prevent deploying the new service
            exit 1 
          fi

          echo "Migration task succeeded. Proceeding with service deployment."

      - name: Force ECS to pull latest image
        run: |
          echo "Forcing ECS service to pull latest image..."
          echo "Service will pull: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"

          # Force new deployment - ECS will pull the image (default :latest)
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Deployment summary
        run: |
          echo "✅ Backend deployment triggered successfully!"
          echo "Image: ${{ steps.build-image.outputs.image }}"
          echo "ECS Service: ${{ env.ECS_SERVICE }}"
          echo "Cluster: ${{ env.ECS_CLUSTER }}"
          echo "Deployment is in progress. ECS will pull the updated image."

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel Production
        working-directory: ./my-app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Link project if not already linked (non-interactive)
          if [ ! -f .vercel/project.json ]; then
            echo "Linking Vercel project..."
            vercel link --yes --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID --project=$VERCEL_PROJECT_ID || true
          fi
          
          # Deploy to production
          vercel deploy --prod --yes --token=$VERCEL_TOKEN

      - name: Deployment summary
        run: |
          echo "✅ Frontend deployment to Vercel triggered successfully!"
          echo "Production deployment is in progress. Check Vercel dashboard for status."
          echo "Project ID: ${{ secrets.VERCEL_PROJECT_ID }}"

