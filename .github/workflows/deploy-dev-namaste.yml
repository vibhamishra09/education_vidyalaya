name: Deploy (Dev - Namaste Profile)

on:
  push:
    branches:
      - dev
    paths:
      - 'backend/**'
      - 'my-app/**'
      - '.github/workflows/deploy-dev-namaste.yml'

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: webyalaya-dev-backend-app
  ECS_CLUSTER: webyalaya-dev-backend-cluster
  ECS_SERVICE: webyalaya-dev-backend-task-service

permissions:
  contents: read
  actions: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      skip_deploy: ${{ steps.skip_deploy.outputs.skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'my-app/**'
      - name: Detect skip-dev-namaste directive in commit message
        id: skip_deploy
        run: |
          COMMIT_MSG=$(printf '%s\n' "${{ github.event.head_commit.message }}")
          if echo "$COMMIT_MSG" | grep -iq "\[skip dev-namaste\]"; then
            echo "Skip dev-namaste directive found."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No skip directive found."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Debug changes
        run: |
          echo "Backend changes detected: ${{ steps.filter.outputs.backend }}"
          echo "Frontend changes detected: ${{ steps.filter.outputs.frontend }}"
          echo "Skip dev-namaste deploy flag: ${{ steps.skip_deploy.outputs.skip }}"

  deploy-backend:
    name: Build and Deploy Backend (Namaste Profile)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.skip_deploy != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Namaste Profile)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_NAMASTE_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_NAMASTE_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Create directory structure for Prisma client
        working-directory: ./backend
        run: mkdir -p src/generated

      - name: Generate Prisma Client
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://dummy:dummy@dummy:5432/dummy"
        run: pnpm prisma:generate

      - name: Build application
        working-directory: ./backend
        run: pnpm build

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./backend
        run: |
          # Build Docker image (no tag = implicitly uses :latest)
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY .

          # Also tag with SHA for traceability
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY $ECR_REGISTRY/$ECR_REPOSITORY:dev-$IMAGE_TAG

          # Push both: untagged (latest) and SHA-tagged
          docker push $ECR_REGISTRY/$ECR_REPOSITORY
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:dev-$IMAGE_TAG

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY" >> $GITHUB_OUTPUT

      - name: Force ECS to pull latest image
        run: |
          echo "Forcing ECS service to pull latest image..."
          echo "Service will pull: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          echo "Using AWS credentials: Namaste profile (via static credentials)"

          # Force new deployment - ECS will pull the image (default :latest)
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for ECS deployment to stabilize (fail on real deploy issues)
        run: |
          set -euo pipefail
          echo "Waiting for ECS service to become stable..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}

      - name: Verify ECS rollout state
        run: |
          set -euo pipefail
          ROLLOUT_STATE=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query "services[0].deployments[?status=='PRIMARY'].rolloutState | [0]" \
            --output text)
          echo "Primary rollout state: ${ROLLOUT_STATE}"
          if [ "${ROLLOUT_STATE}" != "COMPLETED" ]; then
            echo "Backend rollout did not complete successfully."
            echo "Recent ECS events:"
            aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services ${{ env.ECS_SERVICE }} \
              --region ${{ env.AWS_REGION }} \
              --query "services[0].events[0:10].[createdAt,message]" \
              --output table || true
            exit 1
          fi

      - name: Deployment summary
        run: |
          echo "✅ Backend deployment completed and service is stable."
          echo "Image: ${{ steps.build-image.outputs.image }}"
          echo "ECS Service: ${{ env.ECS_SERVICE }}"
          echo "Cluster: ${{ env.ECS_CLUSTER }}"
          echo "AWS Credentials: Namaste profile (via static credentials)"
          echo "Rollout state: COMPLETED"

  deploy-frontend:
    name: Deploy Frontend to Vercel (Dev - Namaste)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.skip_deploy != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (Dev Environment Preview)
        working-directory: ./my-app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DEV2 }}
        run: |
          # Link project if not already linked (non-interactive)
          if [ ! -f .vercel/project.json ]; then
            echo "Linking Vercel dev project..."
            vercel link --yes --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID --project=$VERCEL_PROJECT_ID || true
          fi

           # Deploy to production on test environment
          vercel deploy --prod --yes --token=$VERCEL_TOKEN

      - name: Deployment summary
        run: |
          echo "✅ Dev environment frontend deployment to Vercel triggered successfully!"
          echo "Preview deployment is in progress. Check Vercel dashboard for status."
          echo "Project ID: ${{ secrets.VERCEL_PROJECT_ID_DEV2 }}"

  e2e-tests:
    name: Run E2E Tests (Dev)
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (dev-e2e)
        working-directory: ./dev-e2e
        run: pnpm install

      - name: Install Playwright browsers
        working-directory: ./dev-e2e
        run: npx playwright install --with-deps

      - name: Wait for dev site to be ready
        run: |
          echo "Waiting for dev.webyalaya.com..."
          for i in {1..30}; do
            if curl -s https://dev.webyalaya.com > /dev/null; then
              echo "Dev site is up!"
              exit 0
            fi
            echo "Waiting..."
            sleep 10
          done
          echo "Site did not come up in time"
          exit 1

      - name: Run Playwright tests
        working-directory: ./dev-e2e
        env:
          BASE_URL: https://dev.webyalaya.com
        run: |
          npx playwright test

      - name: Check 50% pass threshold
        working-directory: ./dev-e2e
        run: node check-results.js

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dev-e2e/playwright-report